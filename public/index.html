<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordLens AI · 单词视觉记忆</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#182033;--muted:#697386;--p:#6d5dfc;--p2:#8b5cf6;--line:#e6e8f0;--ok:#31a66d;--bad:#db5a5a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#e9e7ff 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.app{max-width:1080px;margin:auto;padding:20px 16px 55px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:23px;font-weight:900}.logo b{color:var(--p)}.badge{background:#eeeaff;color:var(--p);padding:7px 12px;border-radius:999px;font-size:13px}
.hero{background:#fff;border:1px solid var(--line);border-radius:25px;padding:34px;text-align:center;box-shadow:0 16px 45px #202a4010}.hero h1{font-size:clamp(38px,7vw,66px);line-height:1;margin:0 0 15px;letter-spacing:-2px}.hero h1 span{color:var(--p)}.muted{color:var(--muted);line-height:1.7}
.search{display:flex;max-width:780px;margin:24px auto 10px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:17px}.search input{flex:1;min-width:0;border:0;outline:0;padding:13px;font-size:18px}.btn{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}
.status{text-align:center;color:var(--muted);min-height:26px;margin:12px}.layout{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;margin-top:20px}.box{background:#fff;border:1px solid var(--line);border-radius:23px;padding:22px;box-shadow:0 12px 35px #202a4009}
.word{font-size:46px;font-weight:900;margin-top:15px}.phonetic{color:var(--p);margin-top:4px}.meaning{font-size:20px;margin:17px 0}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f0efff;color:var(--p);padding:7px 10px;border-radius:99px;font-size:12px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.secondary{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:11px;cursor:pointer}
.imageBox{height:470px;background:#eef0f6;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center}.imageBox img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;color:#8992a5}.spinner{width:42px;height:42px;border:4px solid #ddd9ff;border-top-color:var(--p);border-radius:50%;animation:spin 1s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
.prompt{margin-top:18px;background:#f8f7ff;border:1px solid #e4e0ff;border-radius:15px;padding:14px;font-size:13px;line-height:1.6;word-break:break-word}.notice{margin-top:16px;padding:13px;border-radius:13px;background:#fff8e8;color:#725b20;font-size:13px;line-height:1.6}
@media(max-width:760px){.layout{grid-template-columns:1fr}.imageBox{height:330px}.hero{padding:25px 17px}.word{font-size:39px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">Word<b>Lens</b> AI</div><div class="badge">真实 API 版</div></div>
  <section class="hero">
    <h1>把单词变成<span>记忆图</span></h1>
    <p class="muted">输入英文单词 → 后端生成专属视觉提示 → OpenAI 图片模型生成记忆图片。<br>API Key 只保存在服务器，不会发送到浏览器。</p>
    <div class="search">
      <input id="word" value="adventure" placeholder="例如 apple / beautiful / adventure">
      <button id="go" class="btn">生成 AI 记忆图</button>
    </div>
  </section>

  <div id="status" class="status"></div>

  <section class="layout">
    <div class="box">
      <h2>📖 单词卡片</h2>
      <div id="w" class="word">adventure</div>
      <div id="ph" class="phonetic">/ədˈventʃər/</div>
      <div id="cn" class="meaning">冒险；冒险经历；奇遇</div>
      <div class="chips"><span class="chip">视觉记忆</span><span class="chip">场景联想</span><span class="chip">AI 生图</span></div>
      <div class="tools">
        <button class="btn" id="speak">🔊 发音</button>
        <button class="secondary" id="copy">📋 复制提示词</button>
        <button class="secondary" id="save">⭐ 收藏</button>
      </div>
      <div id="prompt" class="prompt">生成图片后，这里会显示本次使用的视觉提示词。</div>
      <div class="notice">提示：AI 生图会产生 API 用量/费用。不要把 API Key 写进 index.html。</div>
    </div>

    <div class="box">
      <h2>🖼️ AI 视觉记忆图</h2>
      <div id="imageBox" class="imageBox">
        <div class="placeholder">输入单词并点击“生成 AI 记忆图”</div>
      </div>
    </div>
  </section>
</div>
<script>
const dict={
 apple:["苹果","/ˈæpəl/"],beautiful:["美丽的","/ˈbjuːtɪfəl/"],
 adventure:["冒险；冒险经历；奇遇","/ədˈventʃər/"],ocean:["海洋","/ˈoʊʃən/"],
 travel:["旅行","/ˈtrævəl/"],happy:["开心的","/ˈhæpi/"],mountain:["山","/ˈmaʊntən/"],coffee:["咖啡","/ˈkɔːfi/"]
};
let lastPrompt="";
const $=id=>document.getElementById(id);
function loadWord(){
 const w=$("word").value.trim().toLowerCase();
 const d=dict[w]||["英文单词","/English/"];
 $("w").textContent=w||"—";$("cn").textContent=d[0];$("ph").textContent=d[1];
 return {w,cn:d[0]};
}
function promptFor(w,cn){return `Create one memorable educational vocabulary image for the English word "${w}". Chinese meaning/context: "${cn}". Goal: help a learner remember the meaning through a strong visual association. Show one clear, concrete real-world scene that naturally represents the word. Use vivid but tasteful colors, strong composition, natural lighting, and a friendly premium educational illustration/photo aesthetic. Avoid unrelated objects, confusing symbolism, watermarks, logos, and long text. Do not put the English word or Chinese translation in the image unless it is naturally part of the scene. Square composition, centered subject, suitable for a vocabulary flashcard.`}
async function generate(){
 const {w,cn}=loadWord(); if(!w)return;
 $("go").disabled=true;$("status").textContent="正在调用 OpenAI 生成图片…";
 $("imageBox").innerHTML='<div><div class="spinner"></div><p class="muted">AI 正在绘制记忆场景，请稍候…</p></div>';
 try{
   const r=await fetch("/api/generate-image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({word:w,meaning:cn})});
   const d=await r.json(); if(!r.ok)throw new Error(d.error||"生成失败");
   $("imageBox").innerHTML=`<img src="${d.image}" alt="${w} vocabulary memory image">`;
   lastPrompt=promptFor(w,cn);$("prompt").textContent=lastPrompt;
   $("status").textContent="✓ AI 记忆图生成完成";
 }catch(e){
   $("imageBox").innerHTML='<div class="placeholder">生成失败，请检查服务器和 API Key。</div>';
   $("status").textContent="⚠ "+e.message;
 }finally{$("go").disabled=false}
}
$("go").onclick=generate;$("word").addEventListener("keydown",e=>{if(e.key==="Enter")generate()});
$("speak").onclick=()=>{const u=new SpeechSynthesisUtterance($("w").textContent);u.lang="en-US";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)};
$("copy").onclick=async()=>{if(!lastPrompt)lastPrompt=promptFor($("w").textContent,$("cn").textContent);await navigator.clipboard.writeText(lastPrompt);$("status").textContent="✓ 提示词已复制"};
$("save").onclick=()=>{let a=JSON.parse(localStorage.getItem("wordlens_saved")||"[]"),w=$("w").textContent;if(w&&!a.includes(w))a.push(w);localStorage.setItem("wordlens_saved",JSON.stringify(a));$("status").textContent="⭐ 已收藏 "+w};
</script>
</body>
</html>
